openapi: 3.0.3
info:
  title: VulnScan Pro API
  description: Integrated Vulnerability Scanning and Reporting System API
  version: 1.0.0
  contact:
    name: VulnScan Pro
servers:
  - url: http://localhost:5000/api/v1
    description: Development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, analyst, viewer] }
        createdAt: { type: string, format: date-time }

    Asset:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [ip, domain, subnet] }
        target: { type: string }
        description: { type: string }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }

    Scan:
      type: object
      properties:
        id: { type: string, format: uuid }
        scannerType: { type: string, enum: [nmap, nikto, openvas, wpscan, sqlmap, custom] }
        status: { type: string, enum: [queued, running, completed, failed, cancelled] }
        totalVulnerabilities: { type: integer }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }

    Vulnerability:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        severity: { type: string, enum: [critical, high, medium, low, info] }
        cvssScore: { type: number }
        cveId: { type: string }
        affectedComponent: { type: string }
        remediation: { type: string }

    Report:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        format: { type: string, enum: [pdf, html] }
        status: { type: string, enum: [generating, completed, failed] }
        fileSize: { type: integer }

    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

paths:
  /health:
    get:
      summary: Health check
      tags: [System]
      responses:
        '200':
          description: System is healthy

  /auth/register:
    post:
      summary: Register new user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, email, password]
              properties:
                firstName: { type: string }
                lastName: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        '201': { description: User created }
        '409': { description: Email already exists }

  /auth/login:
    post:
      summary: Login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200': { description: Login successful, returns JWT token }
        '401': { description: Invalid credentials }

  /auth/me:
    get:
      summary: Get current user profile
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: User profile }

  /assets:
    get:
      summary: List assets
      tags: [Assets]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: type, in: query, schema: { type: string, enum: [ip, domain, subnet] } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        '200': { description: List of assets }
    post:
      summary: Create asset
      tags: [Assets]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type, target]
              properties:
                name: { type: string }
                type: { type: string, enum: [ip, domain, subnet] }
                target: { type: string }
                description: { type: string }
      responses:
        '201': { description: Asset created }

  /assets/{id}:
    get:
      summary: Get asset
      tags: [Assets]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Asset details }
    put:
      summary: Update asset
      tags: [Assets]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Asset updated }
    delete:
      summary: Delete asset
      tags: [Assets]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: Asset deleted }

  /scans:
    get:
      summary: List scans
      tags: [Scans]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: List of scans }
    post:
      summary: Create scan
      tags: [Scans]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetId, scannerType]
              properties:
                assetId: { type: string, format: uuid }
                scannerType: { type: string, enum: [nmap, nikto, openvas, wpscan, sqlmap, custom] }
                parameters: { type: object }
      responses:
        '201': { description: Scan queued }

  /scans/{id}:
    get:
      summary: Get scan details
      tags: [Scans]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Scan details with severity summary }

  /scans/{id}/vulnerabilities:
    get:
      summary: Get scan vulnerabilities
      tags: [Scans]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: severity, in: query, schema: { type: string } }
      responses:
        '200': { description: List of vulnerabilities }

  /scans/{id}/cancel:
    post:
      summary: Cancel scan
      tags: [Scans]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Scan cancelled }

  /scans/{id}/retry:
    post:
      summary: Retry failed scan
      tags: [Scans]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Scan retry queued }

  /reports:
    get:
      summary: List reports
      tags: [Reports]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: List of reports }
    post:
      summary: Generate report
      tags: [Reports]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scanId, title]
              properties:
                scanId: { type: string, format: uuid }
                title: { type: string }
                format: { type: string, enum: [pdf, html, json] }
                template: { type: string, enum: [executive, technical, compliance, html_web, json_export] }
      responses:
        '202': { description: Report generation started }

  /reports/{id}:
    get:
      summary: Get report metadata
      tags: [Reports]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Report metadata }
        '404': { description: Report not found }

  /reports/{id}/regenerate:
    post:
      summary: Regenerate an existing report from the same scan
      tags: [Reports]
      security: [{ bearerAuth: [] }]
      responses:
        '202': { description: Regeneration started }

  /reports/{id}/download:
    get:
      summary: Download report
      tags: [Reports]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Report file download }

  /dashboard/stats:
    get:
      summary: User dashboard statistics
      tags: [Dashboard]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Dashboard stats }

  /dashboard/admin:
    get:
      summary: Admin statistics
      tags: [Dashboard]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Admin stats }

  /admin/users:
    get:
      summary: List all users (admin)
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: List of users }

  /admin/users/{id}:
    put:
      summary: Update user role/status (admin)
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: User updated }

  /admin/audit-logs:
    get:
      summary: View audit logs (admin)
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Audit log entries }
