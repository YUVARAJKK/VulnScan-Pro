server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — serve index.html for all routes
    # IMPORTANT: never cache index.html — it references hashed asset bundles,
    # and caching it makes browsers keep the old (possibly broken) JS forever.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Proxy API calls to backend
    # NOTE: `resolver` + variable proxy_pass makes nginx re-resolve the
    # `backend` hostname at request time (Docker DNS at 127.0.0.11). Without
    # this, nginx caches the backend IP at startup, and if the backend
    # container is recreated (new IP), every API call dies with 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /api/ {
        set $backend_upstream http://backend:5000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
