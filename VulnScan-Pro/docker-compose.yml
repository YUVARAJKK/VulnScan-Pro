# Docker Compose configuration for VulnScan Pro
# Updated: Removed third-party scanner containers, added Python scanner engine

services:
  # ─── PostgreSQL ───
  postgres:
    image: postgres:15-alpine
    container_name: vulnscan-postgres
    environment:
      POSTGRES_DB: vulnscan_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Redis (Job Queue & Caching) ───
  redis:
    image: redis:7-alpine
    container_name: vulnscan-redis
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Backend API Server ───
  backend:
    build: ./backend
    container_name: vulnscan-backend
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: vulnscan_dev
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: change-this-to-a-256-bit-random-secret
      JWT_EXPIRES_IN: 24h
      CORS_ORIGIN: http://localhost:3000
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@vulnscan-pro.local}
      # Workers are run as separate containers — skip in-process worker startup
      WORKER_MODE: 'true'
      # Behind the frontend nginx proxy: honour X-Forwarded-For for client IPs
      TRUST_PROXY: 'true'
    # No host port published: the API is intentionally reachable only through
    # the frontend nginx (which sets X-Forwarded-For). Direct exposure would
    # allow spoofing that header to bypass per-IP rate limits.
    expose:
      - '5000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - reports:/app/reports
      - logs:/app/logs
    restart: unless-stopped

  # ─── Internal Scan Worker (authenticated users) ───
  worker:
    build:
      context: .
      dockerfile: Dockerfile.scanner
    container_name: vulnscan-worker
    command: node src/workers/scanWorker.js
    user: root
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: vulnscan_dev
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SCANNER_DB_URL: postgresql://postgres:postgres@postgres:5432/vulnscan_dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - reports:/app/reports
    restart: unless-stopped

  # ─── Public Scan Worker (unauthenticated public scans via BullMQ) ───
  public-worker:
    build:
      context: .
      dockerfile: Dockerfile.scanner
    command: node src/workers/publicScanWorker.js
    user: root
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: vulnscan_dev
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@vulnscan-pro.local}
      SCANNER_DB_URL: postgresql://postgres:postgres@postgres:5432/vulnscan_dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - reports:/app/reports
    deploy:
      replicas: 2  # Run 2 worker replicas for horizontal scaling
    restart: unless-stopped

  # ─── Frontend (React + Vite via Nginx) ───
  frontend:
    build: ./frontend
    container_name: vulnscan-frontend
    ports:
      - '3001:3000'
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  reports:
  logs:
